name: Verify M0020 (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify recovered participant links and lobby without changing state
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 3m
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import json,pathlib,urllib.request
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            def f(x,n):return x.get(n,x.get(n[0].lower()+n[1:]))
            m=f(s,'Matches')['M0020']
            print('Match:',f(m,'Id'),'status:',f(m,'Status'),'tournament:',f(m,'TournamentId'),'series:',f(m,'SeriesId'),'port:',f(m,'Port'))
            print('Join DMs stored:',len(f(m,'JoinDmMessageIds') or {}))
            for n in ['PlayerOneDiscordId','PlayerTwoDiscordId']:
             with urllib.request.urlopen('http://127.0.0.1:15080/join/M0020?player='+str(f(m,n)),timeout=10) as r:
              page=r.read().decode();assert r.status==200 and 'M0020' in page and (':'+str(f(m,'Port'))) in page
              print(n+': participant join page HTTP 200, correct match/port')
            p=pathlib.Path('data/matches/M0020/lobby-status.json')
            if p.exists():
             lobby=json.loads(p.read_text());print('Lobby state:',f(lobby,'State'))
            print('Match map:',f(m,'MapUid'))
            PY
