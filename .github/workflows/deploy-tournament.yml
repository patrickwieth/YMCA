name: Verify updated bot without tournament changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect series and game numbers without changing state
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 45m
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import json,pathlib
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            def f(x,n):return x.get(n,x.get(n[0].lower()+n[1:]))
            ts=f(s,'Tournaments');ss=f(s,'Series');ms=f(s,'Matches')
            for t in list(ts.values())[-4:]:
             print('TOURNAMENT',f(t,'Id'),'status',f(t,'Status'),'round',f(t,'RoundNumber'),'wins-required',f(t,'WinsRequired'),'selection',f(t,'MapSelection') or 'PlayerChoice(default)')
             for sid in (f(t,'SeriesIds') or [])[-8:]:
              v=ss[sid];a=str(f(v,'PlayerOneDiscordId'));b=str(f(v,'PlayerTwoDiscordId'))
              wins=f(v,'Wins') or {};picks=f(v,'MapPicks') or {}
              print(' SERIES',sid,'round',f(v,'TournamentRound'),'status',f(v,'Status'),'score',wins.get(a,0),wins.get(b,0),'pick-counts',len(picks.get(a,[])),len(picks.get(b,[])))
              print(' MAPS',[(f(x,'Title'),f(x,'Uid')) for x in f(v,'Maps') or []])
              for mid in f(v,'MatchIds') or []:
               m=ms[mid];winner=f(m,'FinalWinnerDiscordId');side='one' if str(winner)==a else 'two' if str(winner)==b else '-'
               print('  MATCH',mid,'game',f(m,'SeriesGameNumber'),'status',f(m,'Status'),'winner-side',side,'parent',f(m,'ParentMatchId'),'map',f(m,'MapTitle'),'generation',f(f(m,'Generation') or {},'Id'))
            PY
