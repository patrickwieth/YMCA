name: Deploy Tournament Bot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only timer deployment and match status
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import pathlib,json,subprocess
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            c=json.loads(pathlib.Path('tournament-bot.json').read_text())
            revision=pathlib.Path('data/map-choice-timer-deployed-revision')
            print('DEPLOYED_REVISION',revision.read_text().strip() if revision.exists() else 'not yet deployed')
            print('NATIVE_REMOTE_CONFIGURED',bool(c['server'].get('remoteHost')))
            print('ACTIVE_MATCHES',[(m['Id'],m['Status'],m.get('HostingHostId'),m.get('FailureReason')) for m in s['Matches'].values() if m['Status'] in ['Queued','StartingServer','WaitingForPlayers','Playing']])
            t=s['Tournaments']['T013']
            print('MAP_CHOICES',[(sid,s['Series'][sid]['Status'],s['Series'][sid].get('MapChoiceTimer')) for sid in t['SeriesIds'] if s['Series'][sid]['Status']=='AwaitingMapPicks'])
            stages=sorted(pathlib.Path('data/recovery').glob('map-choice-*'))
            if stages:
                stage=stages[-1]
                print('STAGING',str(stage),'built', (stage/'image-build.log').exists(),'stopped_for_update',(stage/'state-quiescent.json').exists())
                for name in ['build.log','image-build.log']:
                    p=stage/name
                    if p.exists():print('BUILD_TAIL',name,'\n'.join(p.read_text(errors='replace').splitlines()[-5:]))
            print('BOT_STARTED_AT',subprocess.check_output(['docker','inspect','--format','{{.State.StartedAt}}','ymca-tournament-bot'],text=True).strip())
            PY
