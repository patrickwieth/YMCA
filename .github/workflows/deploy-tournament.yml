name: Deploy Tournament Bot
on:
  workflow_dispatch:
    inputs:
      resend:
        description: 'Send map-choice reminders to pending players only'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Send missing map-choice reminders without restarting
        if: inputs.resend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd ~/src/YMCA-tournament
            git fetch origin maintenance/tournament0976-pause
            script=$(mktemp /tmp/ymca-remind-XXXXXX.py)
            trap 'rm -f "$script"' EXIT
            git show FETCH_HEAD:tools/tournament-reset-20261120.py > "$script"
            cd TournamentBot/deploy
            python3 "$script" remind
      - name: Read-only championship verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import json,pathlib,subprocess,urllib.request,urllib.parse,html,re,time
            print('HOST_UPTIME',subprocess.check_output(['uptime'],text=True))
            print('HOST_MEMORY',subprocess.check_output(['free','-m'],text=True))
            print('HOST_CPUS',subprocess.check_output(['nproc'],text=True))
            print('VMSTAT',subprocess.check_output(['vmstat','1','6'],text=True))
            for i in range(3):
                print('CONTAINER_STATS',subprocess.check_output(['docker','stats','--no-stream','--format','{{.Name}} CPU={{.CPUPerc}} RAM={{.MemUsage}} RAMpct={{.MemPerc}} PIDS={{.PIDs}}'],text=True))
                print('BOT_PROCESSES',subprocess.check_output(['docker','top','ymca-tournament-bot','-eo','pid,ppid,pcpu,pmem,rss,etime,comm'],text=True))
                time.sleep(3)
            info=json.loads(subprocess.check_output(['docker','inspect','ymca-tournament-bot'],text=True))[0]
            print('CONTAINER_LIMITS',{k:info['HostConfig'].get(k) for k in ['Memory','MemorySwap','NanoCpus','CpuQuota','CpuPeriod','CpusetCpus','PidsLimit']},'OOMKilled',info['State']['OOMKilled'])
            for f in ['cpu','memory','io']:
                p=pathlib.Path('/proc/pressure')/f
                if p.exists():print('HOST_PRESSURE',f,p.read_text())
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            t=s['Tournaments']['T013']
            print('CURRENT_ROUND',t['RoundNumber'],t['Status'])
            for sid in t['SeriesIds']:
                r=s['Series'][sid]
                if r['TournamentRound']==t['RoundNumber']:
                    print('ROUND_SERIES',sid,r['Status'],[(s['Players'][str(r[k])]['OpenRaName'],len(r['MapPicks'].get(str(r[k]),[]))) for k in ['PlayerOneDiscordId','PlayerTwoDiscordId']],r['MatchIds'])
            series=s['Series']['S0021']
            print('TARGET_SERIES',series['Status'],'wins',list(series['Wins'].values()),'matches',series['MatchIds'])
            for mid in series['MatchIds']:
                m=s['Matches'][mid]
                print('TARGET_MATCH',{k:m.get(k) for k in ['Id','Status','SeriesGameNumber','FailureReason','ServerRetainUntilUtc','MapTitle']},'join_dm_players',[s['Players'].get(str(p),{}).get('OpenRaName') for p in m.get('JoinDmMessageIds',{})],'reports',[(s['Players'].get(str(p),{}).get('OpenRaName'),r) for p,r in m.get('PlayerReports',{}).items()],'result_dm_players',[s['Players'].get(str(p),{}).get('OpenRaName') for p in m.get('ResultDmMessageIds',{})])
            for pid,p in s['Players'].items():
                if 'first' in (p.get('OpenRaName','')+' '+p.get('DiscordDisplayName','')).lower():
                    print('PLAYER_LOOKUP',p.get('OpenRaName'),p.get('DiscordDisplayName'),'entrant',int(pid) in t['Entrants'])
                    for sid in t['SeriesIds']:
                        series=s['Series'][sid]
                        if int(pid) in [series['PlayerOneDiscordId'],series['PlayerTwoDiscordId']]:
                            print('PLAYER_SERIES',sid,series['Status'],[(s['Players'][str(series[k])]['OpenRaName'],s['Players'][str(series[k])]['DiscordDisplayName'],len(series['MapPicks'].get(str(series[k]),[]))) for k in ['PlayerOneDiscordId','PlayerTwoDiscordId']],series['MatchIds'])
            old=json.loads(pathlib.Path('data/recovery/reset-T012-20261120/quiescent.json').read_text())
            print('ROSTER_PRESERVED',set(t['Entrants'])==set(old['Tournaments']['T012']['Entrants']))
            print('OLD_TOURNAMENT',s['Tournaments']['T012']['Status'])
            print('INVITATION_RECEIPTS',len(json.loads(pathlib.Path('data/recovery/reset-T012-20261120/invitations.json').read_text())))
            logs=subprocess.check_output(['docker','logs','--since','30m','ymca-tournament-bot'],text=True,stderr=subprocess.STDOUT)
            for line in logs.splitlines():
                if 'Tournament notification failed:' in line or 'Cannot send messages' in line or 'Invalid Form Body' in line:
                    print('NOTIFICATION_ERROR',line)
            top=subprocess.check_output(['docker','top','ymca-tournament-bot','-eo','pid,args'],text=True)
            for m in s['Matches'].values():
                if m.get('TournamentId')!='T013':continue
                lines=[l for l in top.splitlines() if 'Server.Name=YMCA Tournament '+m['Id']+' ' in l]
                print('NEW_MATCH',m['Id'],m['Status'],'join_dms',len(m.get('JoinDmMessageIds',{})),'password_matches',bool(lines) and ('Server.Password='+m['Password']+' ') in lines[0])
            m=s['Matches']['M0041']
            for side in ['PlayerOneDiscordId','PlayerTwoDiscordId']:
                url='http://127.0.0.1:15080/join/M0041?player='+str(m[side])
                try:
                    page=urllib.request.urlopen(url).read().decode()
                    links=re.findall(r'href="(ymca://[^"]+)"',page)
                    for link in links:
                        u=urllib.parse.urlparse(html.unescape(link));q=urllib.parse.parse_qs(u.query)
                        print('JOIN_PAGE_CHECK',side,'port_matches',u.port==m['Port'],'password_matches',q.get('password')==[m['Password']],'spectator',q.get('spectator'))
                except Exception as e:print('JOIN_PAGE_ERROR',str(e))
            for path in pathlib.Path('data/matches/M0041').rglob('*.log'):
                for line in path.read_text(errors='replace').splitlines():
                    if any(x in line.lower() for x in ['password','rejected connection','hiraku']):
                        line=re.sub(r'password[=:][^ ,;]+','password=[REDACTED]',line,flags=re.I)
                        print('MATCH_LOG',path.name,line)
            print('OLD_ACTIVE_MATCHES',[m['Id'] for m in s['Matches'].values() if m['Status'] in ['Queued','StartingServer','WaitingForPlayers','Playing'] and s['Tournaments'].get(m.get('TournamentId'),{}).get('Status') in ['Completed','Cancelled']])
            PY
