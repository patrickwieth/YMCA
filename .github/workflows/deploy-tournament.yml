name: Inspect M0020 (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed match logs and resource state only
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 3m
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            docker ps --filter name=ymca-tournament-bot --format '{{.Names}} {{.Status}}'
            docker inspect --format 'OOMKilled={{.State.OOMKilled}} Restarts={{.RestartCount}} MemoryLimit={{.HostConfig.Memory}}' ymca-tournament-bot
            free -m
            docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' ymca-tournament-bot
            docker top ymca-tournament-bot -eo pid,ppid,comm,rss
            docker exec ymca-tournament-bot sh -c "grep -A5 '^MapFolders:' /app/game/mods/ca/mod.yaml; find /data/matches/M0020/maps -type f -exec sha256sum {} \;"
            python3 - <<'PY'
            import json,pathlib,re
            root=pathlib.Path('data')
            state=json.loads((root/'tournament-state.json').read_text())
            for key in ('Tournaments','Matches','Series'):
                values=state.get(key,state.get(key[0].lower()+key[1:],{}))
                if isinstance(values,dict): values=values.values()
                for x in values:
                    fields=['Id','Status','TournamentId','Round','MapUid','MapTitle','Port','FailureReason','CurrentRound','SeriesId','SupportDirectory','GeneratedMapPath','GeneratedMapSha256','Generation']
                    print(key,{k:x.get(k,x.get(k[0].lower()+k[1:])) for k in fields if k in x or k[0].lower()+k[1:] in x})
            match=root/'matches/M0020'
            for name in ['process-error.log','process-output.log','Logs/dedicated-debug.log','Logs/dedicated-server.log']:
                p=match/name
                print('\n--- '+name+' ---')
                if p.exists():
                    text=p.read_text(errors='replace')[-18000:]
                    print(re.sub(r'(?i)(password|token)(\s*[=:]\s*)\S+',r'\1\2[REDACTED]',text))
                else: print('not found')
            PY
