name: Deploy Tournament Bot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-remote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live remote bridge without restarting any process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            docker exec ymca-tournament-bot sh -c 'test "$(command -v dotnet)" = /usr/local/bin/dotnet; dotnet --list-runtimes'
            echo "BOT_STARTED_AT=$(docker inspect --format '{{.State.StartedAt}}' ymca-tournament-bot)"
            python3 - <<'PY'
            import pathlib,json,subprocess,hashlib
            root=pathlib.Path('data/remote-host-bridge')
            installed=subprocess.check_output(['docker','exec','ymca-tournament-bot','sha256sum','/usr/local/bin/dotnet'],text=True).split()[0]
            assert installed==hashlib.sha256((root/'dotnet').read_bytes()).hexdigest()
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            for m in s['Matches'].values():
                if m['Status'] not in ['Queued','StartingServer','WaitingForPlayers','Playing']:continue
                marker=pathlib.Path('data/matches')/m['Id']/'remote-relay.json'
                print('ACTIVE_MATCH',m['Id'],m['Status'],'REMOTE' if marker.exists() else 'LOCAL',m.get('FailureReason'))
            print('BOT_PROCESSES',subprocess.check_output(['docker','top','ymca-tournament-bot','-eo','pid,ppid,etime,comm'],text=True))
            print('BRIDGE_PASSTHROUGH_VERIFIED')
            PY
            date -u > data/remote-host-bridge/installed
