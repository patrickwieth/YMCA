name: Native Linux AppImage link tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging/linux/register-links.sh
            tools/test_appimage_links.py
          sparse-checkout-cone-mode: false
      - name: Verify native desktop launcher and isolated registration
        run: |
          command -v gio
          python3 tools/test_appimage_links.py -v
