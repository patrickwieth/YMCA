name: Verify updated bot without tournament changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployed Linux generator, hosts and HTTPS maps
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 45m
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import json,pathlib,subprocess,uuid,urllib.request,hashlib
            root=pathlib.Path.cwd();container='ymca-tournament-bot'
            def run(args,check=True):return subprocess.run(args,check=check,text=True,capture_output=True)
            def f(x,n):return x.get(n,x.get(n[0].lower()+n[1:]))
            s=json.loads((root/'data/tournament-state.json').read_text());assert f(f(s,'Tournaments')['T009'],'Status')=='Cancelled';assert f(f(s,'Matches')['M0020'],'Status')=='Cancelled'
            assert not any(f(m,'Status') in ['Queued','StartingServer','WaitingForPlayers','Playing'] for m in f(s,'Matches').values()),'New match active: do not run diagnostics'
            before=hashlib.sha256((root/'data/tournament-state.json').read_bytes()).hexdigest()
            manifest=run(['docker','exec',container,'cat','/app/game/mods/ca/mod.yaml']).stdout
            assert 'Version: v0.97.4' in manifest and '~^SupportDir|maps/ca/generated: User' in manifest
            assert 'TournamentMapDownloadServer' in manifest
            print('PASS live bot v0.97.4, generated folder and download trait; T009/M0020 cancelled; no active matches')
            base='/tmp/ymca-release-check-'+uuid.uuid4().hex
            for players in [2,4]:
             out=base+'/generated-'+str(players);support=base+'/support-'+str(players)
             cmd=['docker','exec','-e','MOD_SEARCH_PATHS=/app/game/mods,/app/game/engine/mods','-w','/app/game',container]
             generated=run(cmd+['dotnet','/app/game/engine/bin/OpenRA.Utility.dll','ca','--generate-tournament-map','MountainValleys','409274986',str(players),out])
             receipt=json.loads(run(cmd+['cat',out+'/map.json']).stdout);assert receipt['EngineVersion']=='v0.97.4';uid=receipt['Uid']
             run(cmd+['sh','-c','mkdir -p '+support+'/maps/ca/generated && cp '+out+'/generated.oramap '+support+'/maps/ca/generated/test.oramap'])
             args=['timeout','--signal=TERM','--kill-after=5s','18s','dotnet','/app/game/engine/bin/OpenRA.Server.dll','Game.Mod=ca','Engine.EngineDir=/app/game/engine','Engine.SupportDir='+support,'Server.Map='+uid,'Server.MapPool='+uid,'Server.ListenPort=12409','Server.AdvertiseOnline=false','Server.EnableNat=false','Server.QueryMapRepository=false','Server.Name=IsolatedReleaseValidation']
             result=run(cmd+args,check=False);assert result.returncode==124,(result.stdout+result.stderr)[-2000:]
             log=run(cmd+['cat',support+'/Logs/dedicated-server.log']).stdout;assert 'Initial map: '+uid in log
             print('PASS deployed Linux generator + dedicated host, players='+str(players)+', exact UID='+uid)
            # Public archive remains byte-identical and response carries the immutable checksum.
            m=f(s,'Matches')['M0020']
            with urllib.request.urlopen('https://tournament.crowdcontrol.network/map/M0020/download',timeout=30) as response:
             data=response.read();assert hashlib.sha256(data).hexdigest()==f(m,'GeneratedMapSha256');assert int(response.headers['Content-Length'])==len(data);assert response.headers['ETag'].strip('"')==f(m,'GeneratedMapSha256')
            print('PASS public HTTPS map length, SHA-256 and ETag')
            assert before==hashlib.sha256((root/'data/tournament-state.json').read_bytes()).hexdigest(),'Tournament state changed during validation; review before claiming unchanged'
            print('PASS tournament state unchanged during isolated diagnostics; no tournament created')
            PY
