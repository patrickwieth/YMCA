name: Deploy Tournament Bot
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET-T012-16 to replace T012 with the same 16 entrants and send new invitations'
        required: true
permissions:
  contents: read
jobs:
  reset:
    if: inputs.confirmation == 'RESET-T012-16'
    runs-on: ubuntu-latest
    steps:
      - name: Authorized backed-up tournament reset and invitations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 15m
          script: |
            set -eu
            cd ~/src/YMCA-tournament
            git fetch origin maintenance/tournament0976-pause
            script=$(mktemp /tmp/ymca-reset-XXXXXX.py)
            trap 'rm -f "$script"' EXIT
            git show FETCH_HEAD:tools/tournament-reset-20261120.py > "$script"
            cd TournamentBot/deploy
            test -f data/recovery/reset-T012-20261120/new-id.txt
            test "$(cat data/recovery/reset-T012-20261120/new-id.txt)" = T013
            started=$(docker inspect --format '{{.State.StartedAt}}' ymca-tournament-bot)
            i=0
            until docker logs --since "$started" ymca-tournament-bot 2>&1 | grep -q 'Registered tournament commands in '; do
              i=$((i+1))
              test "$i" -lt 60
              sleep 2
            done
            curl --fail --silent --output /dev/null http://127.0.0.1:15080/tournaments
            python3 "$script" invite
