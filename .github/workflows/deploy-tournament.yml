name: Verify updated bot without tournament changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Verify updated host and timer state without changes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 45m
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            python3 - <<'PY'
            import json,pathlib,subprocess
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            active=[m['Id'] for m in s['Matches'].values() if m['Status'] in ['Queued','StartingServer','WaitingForPlayers','Playing']]
            pending=[m['Id'] for m in s['Matches'].values() if (m.get('AttendanceTimer') or {}).get('Outcome')=='Pending']
            print('Active matches:',active);print('Pending admin attendance timers:',pending)
            print('T010 status:',s['Tournaments']['T010']['Status'])
            manifest=subprocess.check_output(['docker','exec','ymca-tournament-bot','cat','/app/game/mods/ca/mod.yaml'],text=True)
            assert 'TournamentAttendanceServer' in manifest and 'Version: v0.97.4' in manifest
            print('PASS deployed host contains attendance server trait and version v0.97.4')
            PY
