name: Deploy Tournament Bot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only post-update verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            cd ~/src/YMCA-tournament/TournamentBot/deploy
            docker exec ymca-tournament-bot awk '$1 == "Version:" {print; exit}' /app/game/mods/ca/mod.yaml
            python3 - <<'PY'
            import json,pathlib
            s=json.loads(pathlib.Path('data/tournament-state.json').read_text())
            old=json.loads(pathlib.Path('data/recovery/pause0976-20261120T200532Z/state-quiescent.json').read_text())
            for k in ['Entrants','Losses','ProcessedMatchIds','ProcessedSeriesIds','SeriesIds','RoundNumber']:
                print('T012_PRESERVED',k,s['Tournaments']['T012'].get(k)==old['Tournaments']['T012'].get(k))
            print('MATCHES',[(m['Id'],m['Status'],m.get('FailureReason')) for m in s['Matches'].values() if m.get('TournamentId')=='T012'])
            PY
