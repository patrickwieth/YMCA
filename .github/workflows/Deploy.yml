name: Deploy

# Automatic deployment lives in packaging.yml, after stable manifest publication.
# Release description edits must not restart servers.
on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Deploy the current stable release using the existing server script'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment }}
    runs-on: ubuntu-latest
    concurrency:
      group: ymca-game-server-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            command -v ss >/dev/null
            connected=$(ss -Htn state established '( sport = :1234 or sport = :1235 )')
            if [ -n "$connected" ]; then
              echo 'YMCA players/spectators are connected; deployment deferred. Retry when both public servers are empty.'
              exit 1
            fi
            ./deploy-ymca-server.sh
