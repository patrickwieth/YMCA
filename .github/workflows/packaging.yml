name: Release Packaging

on:
  push:
    tags:
    - '*'

permissions:
  contents: write  #  for release creation (svenstaro/upload-release-action)

jobs:
  linux:
    name: Linux AppImages
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}

      - name: Package AppImage
        run: |
          make engine
          mkdir -p build/linux
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"
      - name: Upload Packages
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          file: build/linux/*

  macos:
    name: macOS Disk Image
    runs-on: macos-14
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}

      - name: Package Disk Image
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          MACOS_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_USERNAME: ${{ secrets.MACOS_DEVELOPER_USERNAME }}
          MACOS_DEVELOPER_PASSWORD: ${{ secrets.MACOS_DEVELOPER_PASSWORD }}
        run: |
          make engine
          mkdir -p build/macos
          ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

      - name: Upload Package
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          file: build/macos/*

  windows:
    name: Windows Installers
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Repository
        uses: actions/checkout@v3

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: |
          echo "GIT_TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_ENV}
          sudo apt-get update
          sudo apt-get install -y wine64 nsis imagemagick python3
          sudo apt-get install -y wine-development

      - name: Package Installers with Debugging
        run: |
          make engine
          mkdir -p build/windows
          echo "Checking wine version"
          wine64 --version
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows" || {
            echo "Build failed, checking rcedit";
            file rcedit-x64.exe;
            exit 1;
          }
      - name: Upload Packages
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          file: build/windows/*

  publish-update-manifest:
    name: Publish Update Manifest
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Clone deployment branch
        uses: actions/checkout@v4
        with:
          ref: tournament-bot

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p update/assets
          gh release download "${TAG}" --dir update/assets
          WINDOWS="YouMustConstructAdditional-${TAG}-x64.exe"
          LINUX="YouMustConstructAdditional-${TAG}-x86_64.AppImage"
          MAC="YouMustConstructAdditional-${TAG}.dmg"
          test -f "update/assets/${WINDOWS}"
          test -f "update/assets/${LINUX}"
          test -f "update/assets/${MAC}"
          WINDOWS_SHA=$(sha256sum "update/assets/${WINDOWS}" | cut -d' ' -f1)
          LINUX_SHA=$(sha256sum "update/assets/${LINUX}" | cut -d' ' -f1)
          MAC_SHA=$(sha256sum "update/assets/${MAC}" | cut -d' ' -f1)
          cat > update/stable.yaml <<EOF
          Version: ${TAG}
          ReleaseUrl: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}
          WindowsInstaller: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${WINDOWS}
          WindowsInstallerSha256: ${WINDOWS_SHA}
          LinuxAppImage: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${LINUX}
          LinuxAppImageSha256: ${LINUX_SHA}
          MacDiskImage: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MAC}
          MacDiskImageSha256: ${MAC_SHA}
          EOF
          rm -rf update/assets

      - name: Publish stable channel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/stable.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Publish ${GITHUB_REF#refs/tags/} update manifest"
          git push origin HEAD:tournament-bot
