name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  linux:
    name: Linux (.NET 6.0)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Environment
        run: |
          . mod.config;
          awk '/\r$$/ { exit(1); }' mod.config || (printf "Invalid mod.config format. File must be saved using unix-style (LF, not CRLF or CR) line endings.\n"; exit 1);

      - name: Prepare Engine Patches
        shell: bash
        run: |
          ./fetch-engine.sh
          patch=tools/patches/isometric-selection-decoration.patch
          if ! git apply --reverse --check --ignore-space-change "$patch"; then
            git apply --ignore-space-change "$patch"
          fi
          sh tools/prepare-engine-patches.sh

      - name: Check Code
        run: |
          make
          make check-packaging-scripts
          dotnet test Modular.Tests/Modular.Tests.csproj --configuration Release

      - name: Check Mod
        run: |
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 install --yes lua5.1
          make check-scripts

  linux-mono:
    name: Linux (mono)
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Prepare Environment
        run: |
          . mod.config;
          awk '/\r$$/ { exit(1); }' mod.config || (printf "Invalid mod.config format. File must be saved using unix-style (LF, not CRLF or CR) line endings.\n"; exit 1);

      - name: Prepare Engine Patches
        shell: bash
        run: |
          ./fetch-engine.sh
          patch=tools/patches/isometric-selection-decoration.patch
          if ! git apply --reverse --check --ignore-space-change "$patch"; then
            git apply --ignore-space-change "$patch"
          fi
          sh tools/prepare-engine-patches.sh

      - name: Check Code
        run: |
          # check-packaging-scripts does not depend on .net/mono, so is not needed here
          mono --version
          make RUNTIME=mono

  windows:
    name: Windows (.NET 6.0)
    runs-on: windows-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Prepare Engine Patches
        shell: bash
        run: |
          ./fetch-engine.sh
          patch=tools/patches/isometric-selection-decoration.patch
          if ! git apply --reverse --check --ignore-space-change "$patch"; then
            git apply --ignore-space-change "$patch"
          fi
          sh tools/prepare-engine-patches.sh

      - name: Check Code
        shell: powershell
        run: |
          # Work around runtime failures on the GH Actions runner
          if (-not (dotnet nuget list source | Select-String -Quiet 'nuget\.org')) {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
          }
          # The legacy `check` target enables tens of thousands of pre-existing
          # StyleCop violations on Windows. Validate the production build here;
          # Linux performs the existing static and script checks separately.
          .\make.ps1 all
          if (Test-Path 'Modular.Tests/Modular.Tests.csproj') {
            dotnet test Modular.Tests/Modular.Tests.csproj --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path 'TournamentBot.Tests/TournamentBot.Tests.csproj') {
            dotnet test TournamentBot.Tests/TournamentBot.Tests.csproj --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
