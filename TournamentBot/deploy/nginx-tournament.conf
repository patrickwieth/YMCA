server {
    listen 80;
    listen [::]:80;
    server_name tournament.crowdcontrol.network;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tournament.crowdcontrol.network;

    ssl_certificate /etc/letsencrypt/live/tournament.crowdcontrol.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tournament.crowdcontrol.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://ymca-tournament-bot:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
