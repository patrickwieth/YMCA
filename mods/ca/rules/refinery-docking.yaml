# Isometric service cells, resolved after the artwork/footprint layers.
# DockOffset is a WORLD vector from CenterPosition, not a footprint cell offset.
# Main bays: (1,2), except China's (2,1). Extra bays use reserved, passable cells.
PROC:
	DockHost:
		DockOffset: -724,724,0
	SpawnNeighboringActors@dockhelper1:
		Locations: 2,2

Soviet_Refinery:
	DockHost:
		DockOffset: -724,724,0
	SpawnNeighboringActors@dockhelper1:
		Locations: 2,2

PROC.TD:
	DockHost:
		DockOffset: -724,724,0
		IsDragRequired: false
		DragOffset: 0,0,0
		DragLength: 0
	SpawnNeighboringActors@dockhelper1:
		Locations: 2,2

PROC.TD.Nod:
	DockHost:
		DockOffset: -724,566,0
	SpawnNeighboringActors@dockhelper1:
		Locations: 2,2

PROC.SCRIN:
	DockHost:
		DockOffset: -724,724,0
	SpawnNeighboringActors@dockhelper1:
		Locations: 2,2

chsupply:
	# 3x3 building, two external bays in front and two behind.
	# This center equals the former compensated 4x3 center: artwork stays fixed.
	# Keep both approaches clear when placing neighboring buildings.
	Building:
		Dimensions: 3,3
		Footprint: xxx xx= x==
		LocalCenterOffset: 0,0,0
	DockHost:
		DockOffset: -724,2172,0
	FreeActor@1:
		SpawnOffset: 2,3
	SpawnNeighboringActors@dockhelper1:
		Locations: 1,3
	SpawnNeighboringActors@dockhelper2:
		Locations: 0,-1
	SpawnNeighboringActors@dockhelper3:
		Locations: 1,-1

refinery.dockhelper:
	Building:
		Footprint: =
	DockHost:
		DockOffset: 0,0,0
