# GDI joints and Nod lower vertical edges; foundation bases remain untouched.
# Retain the inherited template name for compatibility; it now colors joints.
^GdiBibCornerColor:
	WithBibRemap:
		ImagePrefix: gdibib
		Palette: gdibibplayer
		RemapConnections: true

^NodBibLowerEdgeColor:
	WithBibRemap:
		ImagePrefix: nodbib
		Palette: nodbibplayer
		RemapConnections: true

