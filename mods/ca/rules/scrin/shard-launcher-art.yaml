# Source-based Scrin Shard Launcher: fixed roots + freely rotating upper organism.
# Loaded after the historical China/Scrin2x overlay; only SHAR is replaced.
SHAR:
	-WithBuildingBib:
	RenderSprites:
		Image: shar.native
	BodyOrientation:
		CameraPitch: 85
		UseClassicPerspectiveFudge: false
	Turreted:
		Offset: 0,0,375
	WithSpriteBody:
		Sequence: base
	WithSpriteTurret:
		Sequence: turret
		RequiresCondition: !build-incomplete
		Recoils: false
	Armament@PRIMARY:
		LocalOffset: 577,-35,1490
	IsometricSelectable:
		Bounds: 1448, 1448
		Height: 77
		DecorationBounds: 1920, 1920
		DecorationHeight: 77
