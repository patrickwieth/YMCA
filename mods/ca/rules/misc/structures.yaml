OILP:
	Inherits: ^BuildingTD
	Inherits@POWER: ^DisableOnLowPower
	Inherits@SHAPE: ^1x1Shape
	RenderSprites:
		Palette: player
	Buildable:
		Queue: Building
		BuildPaletteOrder: 200
		IconPalette: chrometd
		Prerequisites: ~anypower, ~promotion.oil_pumps
		Description: Gives a steady income from oil drilling.
	Valued:
		Cost: 500
	Health:
		HP: 25000
	Building:
		Footprint: x
		Dimensions: 1,1
	Tooltip:
		Name: Oil Pump
		ShowOwnerRow: True
	Power:
		Amount: -25
		RequiresCondition: !being-warped
	WithSpriteBody:
		PauseOnCondition: disabled || being-warped
	CashTrickler:
		Interval: 125
		Amount: 10
		PauseOnCondition: disabled
	FireWarheadsOnDeathCA:
		Weapon: BarrelExplode

Oil_Platform:
	Inherits: ^BuildingTD
	Inherits@SHAPE: ^4x4Shape
	WithShadow:
		Offset: 100, 256, 0
		ZOffset: -256
	Buildable:
		Queue: Building
		BuildPaletteOrder: 140
		Prerequisites: ~anypower, ~promotion.oil_pumps, ~!global.nonaval
		Description: Generates income through oil exploitation. \nPlacing many within range circle decreases efficiency.
	Valued:
		Cost: 4000
	Tooltip:
		Name: Oil Platform
	Targetable:
		TargetTypes: Ground, Water, Structure, WaterStructure, C4, DetonateAttack, SpyInfiltrate
	Building:
		Footprint: XXXX XXXX XXXX XXXX
		Dimensions: 4,4
		TerrainTypes: Water
	RequiresBuildableArea:
		Adjacent: 8
	-GivesBuildableArea:
	Health:
		HP: 75000
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Power:
		Amount: -50
		RequiresCondition: !being-warped
	-SpawnActorsOnSell@default:
	-SpawnActorsOnSell:
	-SpawnActorOnDeath@default:
	-SpawnActorOnDeath:
	-SpawnRandomActorOnDeath:
	ProximityExternalCondition@oilextraction:
		Range: 7c0
		ValidRelationships: Ally, Neutral, Enemy
		Condition: oilextraction
	WithRangeCircle@oilextraction:
		Color: 888899AA
		Range: 7c0
	ExternalCondition@oilextraction:
		Condition: oilextraction
	CashTrickler@1:
		Interval: 125
		Amount: 120
		PauseOnCondition: disabled
		RequiresCondition: !oilextraction
	CashTrickler@2:
		Interval: 125
		Amount: 80
		PauseOnCondition: disabled
		RequiresCondition: oilextraction == 1
	CashTrickler@3:
		Interval: 125
		Amount: 60
		PauseOnCondition: disabled
		RequiresCondition: oilextraction == 2
	CashTrickler@4:
		Interval: 125
		Amount: 40
		PauseOnCondition: disabled
		RequiresCondition: oilextraction > 2

Swiss_Bank:
	Inherits: ^BuildingTD
	Inherits@POWER: ^DisableOnLowPowerOrPowerDown
	Inherits@SHAPE: ^2x2Shape
	Inherits@visuals: ^Allied2x2DriveableBib
	# Keep the builder's faction style, including explicit FactionInit from production.
	GrantConditionOnFaction@BANKSOVIET:
		Condition: bank-soviet-bib
		Factions: soviet, russia, nkorea, iraq, china, chinainf, chinatnk, chinaatom
	GrantConditionOnFaction@BANKGDI:
		Condition: bank-gdi-bib
		Factions: gdi, talon, zocom, eagle
	GrantConditionOnFaction@BANKNOD:
		Condition: bank-nod-bib
		Factions: nod, blackh, marked, legion
	GrantConditionOnFaction@BANKSCRIN:
		Condition: bank-scrin-bib
		Factions: scrin, reaper, traveler, harvester
	WithBibRemap:
		AdditionalPalettes:
			sovietbib: bibplayer
			gdibib: gdibibplayer
			nodbib: nodbibplayer
	-WithIdleOverlay@ALLIEDBIB:
	WithFactionBibOverlay@BANKALLIEDBIB:
		Image: alliedbib3x3
		Sequence: idle
		Offset: -1134,0,0
		IsDecoration: true
		ExcludeFactions: soviet, russia, nkorea, iraq, china, chinainf, chinatnk, chinaatom, gdi, talon, zocom, eagle, nod, blackh, marked, legion, scrin, reaper, traveler, harvester
		RequiresCondition: !bank-soviet-bib && !bank-gdi-bib && !bank-nod-bib && !bank-scrin-bib && !build-incomplete
	WithFactionBibOverlay@BANKSOVIETBIB:
		Factions: soviet, russia, nkorea, iraq, china, chinainf, chinatnk, chinaatom
		Image: sovietbib3x3
		Sequence: grid
		Offset: -1134,0,0
		RequiresCondition: bank-soviet-bib && !build-incomplete
		IsDecoration: true
	WithFactionBibOverlay@BANKGDIBIB:
		Factions: gdi, talon, zocom, eagle
		Image: gdibib3x3
		Sequence: idle
		Offset: -1134,0,0
		RequiresCondition: bank-gdi-bib && !build-incomplete
		IsDecoration: true
	WithFactionBibOverlay@BANKNODBIB:
		Factions: nod, blackh, marked, legion
		Image: nodbib3x3
		Sequence: idle
		Offset: -1134,0,0
		RequiresCondition: bank-nod-bib && !build-incomplete
		IsDecoration: true
	WithFactionBibOverlay@BANKSCRINBIB:
		Factions: scrin, reaper, traveler, harvester
		Image: scrinbib3x3
		Sequence: idle
		Offset: -1134,0,0
		RequiresCondition: bank-scrin-bib && !build-incomplete
		IsDecoration: true
	Buildable:
		Queue: Building
		BuildPaletteOrder: 200
		IconPalette: chrometd
		Prerequisites: ~anypower, tier3, ~global.swiss_banks
		Description: Transfers Money to your allies. \nAvoids taxes.
	Valued:
		Cost: 500
	Health:
		HP: 25000
	Building:
		Footprint: xx= xx= ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-724,0
	Tooltip:
		Name: Swiss Bank
		ShowOwnerRow: True
	CashTransferToAllies:
		RequiresCondition: !lowpower && !disabled
	Power:
		Amount: -25
		RequiresCondition: !being-warped
	WithSpriteBody:
		PauseOnCondition: disabled || being-warped
	FireWarheadsOnDeathCA:
		Weapon: BarrelExplode
