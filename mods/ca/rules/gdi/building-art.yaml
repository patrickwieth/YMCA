# Visual-only integration: gameplay footprints, docking and exits stay unchanged.

# Supplied native guard tower; no rotating building art was supplied.
GTWR:
	-WithBuildingBib:
	-WithMakeAnimation:
	RenderSprites:
		Image: gtwr.gdi.png
	Turreted:
		Offset: 0,0,2007
	IsometricSelectable:
		DecorationBounds: 1086, 1086, 0, 0
		DecorationHeight: 111
	WithIdleOverlay@GDIBIB:
		Image: gdibib1x1
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

# Native Heavy Blaster V5 on the existing Ion Defense. Its modeled stationary
# foundation replaces the legacy bib/shadow; the occupied 2x2 cells stay intact.
Ion_Defense:
	-WithBuildingBib:
	-WithShadow:
	-WithEmbeddedTurretSpriteBody:
	RenderSprites:
		Image: ion_defense.native
	# Visual attachment coordinates from the saved model; weapon stats unchanged.
	BodyOrientation:
		CameraPitch: 85
	Turreted:
		Offset: 0,0,226
	Armament:
		LocalOffset: 1631,0,675
	WithSpriteTurret:
		Sequence: turret
		Recoils: false
	IsometricSelectable:
		DecorationBounds: 1901, 1901, 0, 0
		DecorationHeight: 66
	WithIdleOverlay@GDIBIB:
		Image: gdibib2x2
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

