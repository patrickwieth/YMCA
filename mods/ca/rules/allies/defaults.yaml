^BaseWorld:
	FactionCA@randomallies:
		Name: Allies
		InternalName: RandomAllies
		Game: Allies
		RandomFactionMembers: england, france, germany
		Side: Allies
		Description: allies-factions.factionca-at-randomallies-description
	FactionCA@1:
		Name: England
		InternalName: england
		Game: Allies
		Side: Allies
		Description: allies-factions.factionca-at-1-description
	FactionCA@2:
		Name: France
		InternalName: france
		Game: Allies
		Side: Allies
		Description: allies-factions.factionca-at-2-description
	FactionCA@3:
		Name: Germany
		InternalName: germany
		Game: Allies
		Side: Allies
		Description: allies-factions.factionca-at-3-description
	StartingUnits@mcvonlyallies:
		Class: none
		ClassName: MCV Only
		Factions: allies, england, france, germany
		BaseActor: mcv
		SupportProxyActors: allies.dummy
	StartingUnits@mcvdoubledallies:
		Class: doubled
		ClassName: Double MCV
		Factions: allies, england, france, germany
		BaseActor: mcv
		SupportActors: mcv
		SupportProxyActors: allies.dummy
	StartingUnits@lightallies:
		Class: light
		ClassName: Light Support
		Factions: allies, england, france, germany
		BaseActor: mcv
		SupportActors: light_infantry,light_infantry,light_infantry,rocket_infantry,rocket_infantry
		SupportProxyActors: allies.dummy
		InnerSupportRadius: 3
		OuterSupportRadius: 5
	StartingUnits@heavyallies:
		Class: heavy
		ClassName: Heavy Support
		Factions: allies, england, france, germany
		BaseActor: mcv
		SupportActors: light_infantry,light_infantry,light_infantry,rocket_infantry,rocket_infantry,rocket_infantry,2tnk,2tnk
		SupportProxyActors: allies.dummy
		InnerSupportRadius: 3
		OuterSupportRadius: 5
		####################################################################################################

Player:
	ProvidesPrerequisite@regular-allies:
		Prerequisite: allies
		Factions: allies, england, france, germany
	ProvidesPrerequisite@england-allies:
		Prerequisite: england
		Factions: england
	ProvidesPrerequisite@france-allies:
		Prerequisite: france
		Factions: france
	ProvidesPrerequisite@germany-allies:
		Prerequisite: germany
		Factions: germany
	ProvidesPrerequisite@ra-allies:
		Prerequisite: ra
		Factions: allies, england, france, germany

allies.dummy:
	Inherits: ^AlliesSupportPowers

####################################################################################################

^AlliesInfantry:
	GrantConditionOnPrerequisite@InfantryDoctrine:
		Condition: infantry-doctrine
		Prerequisites: promotion.infantry_doctrine
	DamageMultiplier@InfantryDoctrine:
		RequiresCondition: infantry-doctrine
		Modifier: 80
	RangeMultiplier@InfantryDoctrine:
		RequiresCondition: infantry-doctrine
		Modifier: 115

^AlliesTank:
	ProductionCostMultiplier@ArmoredDoctrine:
		Multiplier: 85
		Prerequisites: promotion.armored_doctrine

^AlliesAircraft:
	ProductionCostMultiplier@AirforceDoctrine:
		Multiplier: 85
		Prerequisites: promotion.airforce_doctrine

^AlliesChronoUnit:
	GrantConditionOnPrerequisite@ChronoTech:
		Condition: chrono-tech
		Prerequisites: promotion.chrono_tech
	FirepowerMultiplier@ChronoTech:
		RequiresCondition: chrono-tech
		Modifier: 120
	ExplodeWeaponTeleportEffect:
		ImpactWeapon: ChronoImpact
		TeleportWeapon: ChronoImpact

^AlliesCryoUnit:
	GrantConditionOnPrerequisite@CryoTech:
		Condition: cryo-tech
		Prerequisites: promotion.cryo_tech
	FirepowerMultiplier@CryoTech:
		RequiresCondition: cryo-tech
		Modifier: 120

# Separate foundation sprites preserve the supplied RGBA building artwork.
^AlliedBuildingShadow:
	WithShadow@BUILDINGTRIAL:
		RequiresCondition: !build-incomplete
		ShadowColor: 00000070
		# WORLD offset: short silhouette approximately 4px straight down (sun upper-center).
		Offset: 0,90,0
		ZOffset: -2048

^Allied1x1Visuals:
	IsometricSelectable:
		DecorationBounds: 1448, 1448
	WithIdleOverlay@ALLIEDBIB:
		Image: alliedbib1x1
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

^Allied2x2Visuals:
	# Keep the 2x2 body/selection inside a larger surrounding foundation.
	IsometricSelectable:
		DecorationBounds: 2896, 2896
	WithIdleOverlay@ALLIEDBIB:
		Image: alliedbib3x3
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

^Allied2x2DriveableBib:
	Inherits: ^Allied2x2Visuals
	HitShape:
		Type: Rectangle
			TopLeft: -1024,-1024
			BottomRight: 1024,1024
	Building:
		Dimensions: 3,3
		Footprint: xx= xx= ===
		LocalCenterOffset: 0,-724,0
	WithIdleOverlay@ALLIEDBIB:
		# Body-local coordinates: LocalToWorld rotates and applies camera-pitch scaling.
		# With the building's default pitch this becomes WORLD 0,724,0 (screen 0,+32).
		Offset: -1134,0,0

^Allied3x3Visuals:
	IsometricSelectable:
		DecorationBounds: 4344, 4344
	WithIdleOverlay@ALLIEDBIB:
		Image: alliedbib3x3
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

^AlliesPrismUnit:
	GrantConditionOnPrerequisite@PrismTech:
		Condition: prism-tech
		Prerequisites: promotion.prism_tech
	FirepowerMultiplier@PrismTech:
		RequiresCondition: prism-tech
		Modifier: 120
