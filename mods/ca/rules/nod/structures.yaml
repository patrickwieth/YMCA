		Weapon: Laser
		LocalOffset: 0,-85,3840
		PauseOnCondition: !ammo && charged <= 2
		RequiresCondition: !marked
	Armament@Marked:
		Weapon: Laser.Adv
		LocalOffset: 0,-85,3840
		PauseOnCondition: !ammo && charged <= 2
		RequiresCondition: marked
