^RubberduckBridgePalettes:
	PaletteFromPng@bridge-deck-left:
		Name: bridge-deck-left
		Filename: bits/terrain/environment/bridge-left.png
	PaletteFromPng@bridge-deck-center:
		Name: bridge-deck-center
		Filename: bits/terrain/environment/bridge-center.png
	PaletteFromPng@bridge-deck-right:
		Name: bridge-deck-right
		Filename: bits/terrain/environment/bridge-right.png
	PaletteFromPng@bridge-frame-left:
		Name: bridge-frame-left
		Filename: bits/terrain/environment/bridge-frame-left.png
	PaletteFromPng@bridge-frame-center:
		Name: bridge-frame-center
		Filename: bits/terrain/environment/bridge-frame-center.png
	PaletteFromPng@bridge-frame-right:
		Name: bridge-frame-right
		Filename: bits/terrain/environment/bridge-frame-right.png

World:
	Inherits@RubberduckBridgePalettes: ^RubberduckBridgePalettes
	BridgeLayer:

EditorWorld:
	Inherits@RubberduckBridgePalettes: ^RubberduckBridgePalettes

^RubberduckBridge:
	Inherits: ^Bridge
	Building:
		Dimensions: 1,1
		Footprint: =
	GroundLevelBridge:
		TerrainType: Clear
		Type: RubberduckBridge
	RubberduckBridgeBody:
	RubberduckBridgeCollapse:
	AppearsOnMapPreview:
		Terrain: Clear

^RubberduckBridgeRemains:
	AlwaysVisible:
	Building:
		Dimensions: 1,1
		Footprint: =
	BodyOrientation:
		QuantizedFacings: 1
	BridgePlaceholder:
		Type: RubberduckBridge
		DamageState: Dead

^RubberduckBridgeRepairHut:
	Inherits@BIB: ^Soviet1x1Bib
	AlwaysVisible:
	Building:
		Dimensions: 1,1
		Footprint: x
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
		Image: rubberduck-bridge-repair-hut
		Palette: terrain
	WithSpriteBody:
	Interactable:
	Tooltip:
		Name: Bridge Repair Hut
		ShowOwnerRow: false
	Targetable:
		TargetTypes: BridgeHut
	BridgeHut:
		Types: RubberduckBridge
		RepairPropagationDelay: 0
