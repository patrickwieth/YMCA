# Decorative foundations and an independent art-test actor.
# Existing actor footprints, exits and docking remain unchanged.
^Soviet1x1Bib:
	WithIdleOverlay@SOVIETBIB:
		Image: sovietbib1x1
		Sequence: idle
		RequiresCondition: !build-incomplete
		IsDecoration: true

^Soviet2x2Bib:
	Inherits: ^Soviet1x1Bib
	WithIdleOverlay@SOVIETBIB:
		Image: sovietbib2x2

^Soviet3x3Bib:
	Inherits: ^Soviet1x1Bib
	WithIdleOverlay@SOVIETBIB:
		Image: sovietbib3x3

^Soviet4x4Bib:
	Inherits: ^Soviet1x1Bib
	WithIdleOverlay@SOVIETBIB:
		Image: sovietbib4x4

# Independent art-test actor. FTUR remains the Flame Tower; no production-menu
# duplicate until this Sentry has its own approved weapon/balance definition.
SENTRY.SOVIET:
	Inherits: FTUR
	-Buildable:
	RenderSprites:
		Image: ftur.soviet.v13
	Tooltip:
		Name: Sentry V13 (art test)
	Turreted:
		InitialFacing: 384
		TurnSpeed: 32
	BodyOrientation:
		QuantizedFacings: 32
	WithIdleOverlay@SOVIETBIB:
		Image: sovietbib1x1
	IsometricSelectable:
		DecorationBounds: 1267, 1267, 0, 0
		DecorationHeight: 49

# Separate comparison actor: unchanged PNG base plus a real rotating VXL turret.
SENTRY.SOVIET.VOXEL:
	Inherits: SENTRY.SOVIET
	-WithSpriteTurret:
	Tooltip:
		Name: Sentry V13 (voxel test)
	BodyOrientation:
		QuantizedFacings: 0
		CameraPitch: 85
	RenderVoxels:
		Image: sentry.soviet.voxel
		Palette: sentry-voxel-source
		Scale: 0.98765432
		LightAmbientColor: 0.82, 0.82, 0.82
		LightDiffuseColor: 0.18, 0.18, 0.18
	WithVoxelTurret:
		Sequence: turret
		ShowShadow: false

# Concrete actors remove legacy WithBuildingBib entirely: even a disabled
# legacy trait loads its sprite sequence when the actor is added to the world.
