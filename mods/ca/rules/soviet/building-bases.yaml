# Independent Soviet gameplay bases, initially copied from the shared building rules
# at 3e2b7927. Concrete Soviet actors override faction prerequisites as before.
# Do not inherit Allied concrete actors or Allied visual templates here.

^SovietConyardBase:
	Inherits@BASE1: ^Building
	Inherits@BASE2: ^3x3Building+Bib
	Inherits@BASE3: ^ConcreteArmor
	Inherits@BASE4: ^StructureProduction
	Inherits@BASE5: ^BotFallbackInsurance
	Building:
		Footprint: xxX xxx XxX ===
	Buildable:
		Queue: Building
		BuildPaletteOrder: 1000
		Prerequisites: ~conyardbuildable, ~structures.allies, fix
		Description: Produces structures.
	ProvidesPrerequisite@ra:
		Factions: allies, england, france, germany, soviet, russia, nkorea, iraq
		Prerequisite: structures.ra
	ProvidesPrerequisite@rafaction:
		Factions: allies, england, france, germany, soviet, russia, nkorea, iraq
		Prerequisite: ra
	ProvidesPrerequisite@allies:
		Factions: allies, england, france, germany
		Prerequisite: structures.allies
	ProvidesPrerequisite@alliesvanilla:
		Factions: allies
		Prerequisite: structures.alliesvanilla
	ProvidesPrerequisite@england:
		Factions: england
		Prerequisite: structures.england
	ProvidesPrerequisite@france:
		Factions: france
		Prerequisite: structures.france
	ProvidesPrerequisite@germany:
		Factions: germany
		Prerequisite: structures.germany
	ProvidesPrerequisite@soviet:
		Factions: soviet, russia, nkorea, iraq
		Prerequisite: structures.soviet
	ProvidesPrerequisite@russia:
		Factions: russia
		Prerequisite: structures.russia
	ProvidesPrerequisite@nkorea:
		Factions: nkorea
		Prerequisite: structures.nkorea
	ProvidesPrerequisite@iraq:
		Factions: iraq
		Prerequisite: structures.iraq
	ProvidesPrerequisite@sandbag:
		Factions: allies, england, france, germany
		Prerequisite: structures.sandbag
	Health:
		HP: 150000
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Valued:
		Cost: 2500
	Tooltip:
		Name: Construction Yard
	Transforms:
		RequiresCondition: factundeploy
		PauseOnCondition: chrono-vortex || being-captured || c4 || build-incomplete || being-warped
		IntoActor: mcv
		Offset: 1,1
		Facing: 384
	TransformsIntoMobile:
		RequiresCondition: factundeploy
		Locomotor: heavywheeled
		RequiresForceMove: true
	TransformsIntoPassenger:
		RequiresCondition: factundeploy
		CargoType: Vehicle
		RequiresForceMove: true
	TransformsIntoRepairable:
		RequiresCondition: factundeploy
		RepairActors: fix, fix.soviet, rep, rep.nod
		RequiresForceMove: true
	TransformsIntoTransforms:
		RequiresCondition: factundeploy && build-incomplete
	Sellable:
		RequiresCondition: !build-incomplete && !chrono-vortex && !being-captured && !c4 && !being-warped
	GrantConditionOnPrerequisite@GLOBALFACTUNDEPLOY:
		Condition: factundeploy
		Prerequisites: global-factundeploy
		Color: 8A8A8A
	WithBuildingPlacedAnimation:
		RequiresCondition: !build-incomplete && !chrono-vortex
	Power:
		Amount: 0
		RequiresCondition: !being-warped
	WithDeathAnimation:
		DeathSequence: dead
		UseDeathTypeSuffix: false
	ProvidesPrerequisite@buildingname:
		Condition: invulnerability
	SpawnActorsOnSell:
		ActorTypes: light_infantry,light_infantry,light_infantry,light_infantry,engineer

	RenderSprites:
		Image: fact.soviet

