^SovietFactoryBase:
	Inherits@BASE1: ^Building
	Inherits@BASE2: ^3x2Building+Bib
	Inherits@BASE3: ^PrimaryBuilding
	Inherits@BASE4: ^VehicleProduction
	RenderSprites:
		Image: weap.soviet
	Buildable:
		Queue: Building
		BuildPaletteOrder: 80
		Prerequisites: proc, ~structures.allies
		Description: Produces vehicles.
	Valued:
		Cost: 2000
	Tooltip:
		Name: War Factory
	Health:
		HP: 150000
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	WithProductionDoorOverlayCA:
		RequiresCondition: !build-incomplete
		Sequence: build-top
	Power:
		Amount: -30
		RequiresCondition: !being-warped
	ProvidesPrerequisite@buildingname:
	Targetable:
		TargetTypes: Ground, C4, DetonateAttack, Structure, SabInfiltrate, SpyInfiltrate
	InfiltrateForSupportPower:
		Proxy: vehicles.upgraded
		Types: SpyInfiltrate
	InfiltrateForSupportPower@veh:
		Types: SabInfiltrate
		Proxy: veh.soviet.stolen
	-ActorPreviewPlaceBuildingPreview:
	SequencePlaceBuildingPreview:
		Sequence: place

^SovietRepairBase:
	Inherits@BASE1: ^Building
	Inherits@BASE2: ^3x3Shape
	RenderSprites:
		Image: fix.soviet
	Buildable:
		Queue: Building
		BuildPaletteOrder: 100
		Prerequisites: weap, ~structures.allies
		Description: Repairs vehicles.
	Valued:
		Cost: 1200
	Tooltip:
		Name: Service Depot
	Building:
		Footprint: _+_ +++ _+_
		Dimensions: 3,3
	Health:
		HP: 80000
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Reservable:
	RallyPoint:
	RepairsUnits:
		ValuePercentage: 0
		HpPerStep: 1000
		Interval: 7
		StartRepairingNotification: Repairing
		FinishRepairingNotification: UnitRepaired
		PlayerExperience: 15
		RequiresCondition: !forceshield && !invulnerability && !being-warped
	WithBuildingBib:
		HasMinibib: true
		Sequence: bibFix
	WithResupplyAnimation:
		RequiresCondition: !build-incomplete
	Power:
		Amount: -30
		RequiresCondition: !being-warped
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@repair:
		Prerequisite: repair
	HitShape:
		TargetableOffsets: 840,0,0, 598,-640,0, 598,640,0, -1060,0,0, -768,-640,0, -768,640,0
		Type: Polygon
			Points: -1536,-300, -640,-811, 640,-811, 1536,-300, 1536,555, 640,1110, -640,1110, -1536,555
	ProximityExternalCondition@AIRCRAFTREPAIR:
		Condition: aircraft-repair
		Range: 10c0
	WithRangeCircle@AIRCRAFTREPAIR:
		Color: 888899AA
		Range: 10c0

