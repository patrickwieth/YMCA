ScrollPanel@YMCA_NEWS_PANEL:
	Width: 400
	Height: 265
	TopBottomSpacing: 15
	ItemSpacing: 5
	Children:
		Container@NEWS_ITEM_TEMPLATE:
			X: 10
			Width: PARENT_WIDTH - 40
			Height: 40
			Children:
				Label@TITLE:
					Width: PARENT_WIDTH
					Height: 15
					Align: Center
					Font: Bold
				Label@AUTHOR_DATETIME:
					Width: PARENT_WIDTH
					Height: 15
					Align: Center
					Font: TinyBold
				Label@CONTENT:
					Width: PARENT_WIDTH
				Button@NEWS_LINK:
					Width: PARENT_WIDTH
					Height: 28
		Label@NEWS_STATUS:
			X: 20
			Width: PARENT_WIDTH - 64
			Height: PARENT_HEIGHT
			Align: Center
			VAlign: Middle
