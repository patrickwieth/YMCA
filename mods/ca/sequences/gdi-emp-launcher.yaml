# Decorative 3x3 bib aligned to the back of the unchanged 2x2 obstruction.
# The front-left/front-right one-cell strips are not building cells.
gdibib3x3.emp:
	Inherits: gdibib3x3
	idle:
		Offset: 0,32

# Fixed supplied launcher; no rotating building frames.
patr.gdi.png:
	Inherits: patr
	idle:
		Filename: bits/gdi/buildings/emp launcher.png
		Start: 0
		Length: 1
		Facings: 1
		Scale: 1
		Anchor: Bottom
		Offset: 0,16
	damaged-idle:
		Filename: bits/gdi/buildings/emp launcher.png
		Start: 0
		Length: 1
		Facings: 1
		Scale: 1
		Anchor: Bottom
		Offset: 0,16
	empty:
		Filename: bits/gdi/buildings/emp launcher empty.png
		Start: 0
		Length: 1
		Facings: 1
		Scale: 1
		Anchor: Bottom
		Offset: 0,16
	damaged-empty:
		Filename: bits/gdi/buildings/emp launcher empty.png
		Start: 0
		Length: 1
		Facings: 1
		Scale: 1
		Anchor: Bottom
		Offset: 0,16

emp-launch-missile:
	idle:
		Filename: bits/gdi/buildings/emp-missile32.png
